<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grid touhua</title>
    <style>
      body {
        box-sizing: border-box;
        background-image: linear-gradient(110deg, #ffced9, #95db92);
        min-height: calc(100vh - 100px);
        margin: 50px;
        background-attachment: fixed;
      }

      .container {
        border: 1px solid rgb(4, 0, 255);
        height: 50vh;
      }
      .item {
        border: 4px solid rgb(255, 90, 90);
        border-radius: 3px;
        font-size: 30px;
        padding: 5px;
        background-color: pink;
        text-align: center;
      }
      .container2 {
        border: 1px solid rgb(4, 0, 255);
      }

      .container3 {
        border: 1px solid rgb(4, 0, 255);
      }

      .container4 {
        border: 1px solid rgb(4, 0, 255);
      }
    </style>
  </head>

  <body>
    <h2>Grid basics</h2>
    <div class="container">
      <div class="item item1">1</div>
      <div class="item item2">2</div>
      <div class="item item3">3</div>
      <div class="item item4">4</div>
      <div class="item item5">5</div>
      <div class="item item6">6</div>
    </div>

    <h2>Special units</h2>

    <div class="container2">
      <div class="item">Lorem ipsum moi</div>
      <div class="item">Lorem ipsum moi</div>
      <div class="item">Lorem ipsum moi</div>
      <div class="item">Lorem ipsum moi</div>
    </div>

    <h2>Repeat function and keywords</h2>

    <div class="container3">
      <div class="item">1</div>
      <div class="item">2</div>
      <div class="item">3</div>
      <div class="item">4</div>
    </div>

    <h2>Grid area names</h2>

    <div class="container4">
      <div class="item item_h">Header</div>
      <div class="item item_n">Nav</div>
      <div class="item item_m">Main</div>
      <div class="item item_f">Footer</div>
    </div>
  </body>
</html>
