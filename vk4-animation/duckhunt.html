<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Duck Hunt – CSS animations</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
      rel="stylesheet"
    />

    <style>
      /* 1. Sivun perusmuotoilu */
      body {
        min-height: 100vh;
        font-family: "Press Start 2P", cursive;
        line-height: 1.7;
      }

      main {
        width: 800px;
        margin: 0 auto;
      }

      .dh {
        width: 200px;
        padding: 10px;
        float: left;
        clip-path: circle(50% at 50% 50%);
        shape-outside: circle(50% at 50% 50%);
      }

      /* 2. Pelialue: absolute-elementit sijoitetaan tämän sisään */
      .stage {
        position: relative;
        width: 800px;
        height: 481px;
        background: url("img/stage.png") center / contain no-repeat;
        overflow: hidden; /* Karkaava ankka ei näy alueen ulkopuolella */
        cursor: crosshair;
      }

      #output {
        margin-top: 40px;
        padding-left: 30px;
        font-family: monospace;
        font-size: 14px;
        line-height: 1.5;
      }

      .dog {
        position: absolute;
        left: 30px;
        bottom: 30px;
        width: 120px;
        height: 110px;
        /* background-color: blue; */
        background-image: url(img/sprite.png);
        background-position: 0 0;
        /* animation-name: doggowalk;
        animation-duration: 0.6s;
        animation-timing-function: steps(5);
        animation-iteration-count: 3; */

        /* animation: name duration timing-function delay iteration-count direction fill-mode play-state; */

        /* Nämä animaatiot starttaavat samanaikaisesti */
        /* Kolmas animaatio vaatii siis delayn käytön */

        animation:
          doggowalk 0.5s steps(5) 4,
          doggomove 2s linear forwards,
          doggosniff 0.5s steps(2) 2s 6;
      }

      @keyframes doggowalk {
        from {
          background-position: 0 0;
        }
        to {
          background-position: -600px 0;
        }
      }

      @keyframes doggomove {
        from {
          left: 30px;
        }
        to {
          left: 300px;
        }
      }

      @keyframes doggosniff {
        from {
          background-position: -360px 0;
        }
        to {
          background-position: -600px 0;
        }
      }

      .duck {
        position: absolute;
        top: 50px;
        left: 50px;
        width: 80px;
        height: 80px;
        background-image: url(img/sprite.png);
        background-position: 0 -220px;
      }

      .duckfly {
        animation: fly 5s linear forwards;
      }

      /* animation: name duration timing-function delay iteration-count direction fill-mode play-state; */

      @keyframes fly {
        0% {
          left: 50px;
          top: 50px;
        }
        25% {
          left: 200px;
          top: 100px;
        }
        50% {
          left: 250px;
          top: 300px;
        }
        100% {
          left: 500px;
          top: 100px;
        }
      }

      /* Tätä luokkaa voi testata selaimen konsolista. */
      .paused {
        animation-play-state: paused;
      }

      /* Koiran animaatiot */
    </style>
  </head>

  <body>
    <main>
      <h1>Duckhunt Stage</h1>

      <p>
        <img class="dh" src="img/duckhunt.png" alt="" />
        Duck Hunt is a fantastic arcade game that takes inspiration from the
        original classic available on Nintendo game systems. You must shoot the
        moving ducks down with your mouse and see how many points you can score.
        Be sure to avoid shooting your faithful dog!
      </p>

      <div class="stage">
        <div class="dog"></div>
        <div class="duck"></div>
      </div>

      <h2>Animation events</h2>
      <ul id="output"></ul>
    </main>

    <script>
      const dog = document.querySelector(".dog");
      const duck = document.querySelector(".duck");
      const stage = document.querySelector(".stage");
      const output = document.querySelector("#output");

      // 1. Apufunktio: lisätään viesti tapahtumalokiin.
      function addLog(message) {
        const li = document.createElement("li");
        li.textContent = message;
        output.prepend(li);
      }

      // 2. Seurataan koiran animaatioiden alkua, toistoja ja loppua.
      const animationEvents = [
        "animationstart",
        "animationiteration",
        "animationend",
      ];

      animationEvents.forEach((eventType) => {
        dog.addEventListener(eventType, (event) => {
          addLog(
            `${event.animationName}: ${event.type} ` +
              `(${event.elapsedTime.toFixed(1)} s)`,
          );

          // HUOM: animationend laukeaa jokaisesta päättyvästä animaatiosta.
          // Käynnistetään ankka vasta koko hyppysarjan päätyttyä.
          if (
            event.type === "animationend" &&
            event.animationName === "doggosniff"
          ) {
            console.log("Here");
            // Piilota koira
            duck.classList.add("duckfly");
          }
        });
      });

      // Osuma: jäädytetään ankan tämänhetkinen sijainti ennen
      // lentämisluokan poistamista ja putoamisanimaation aloittamista.
      duck.addEventListener("click", () => {
        console.log(
          "Ankka pyshtyy ja putoamis animaatio alkaa TAI pisteitä tulee",
        );
      });

      //  Jos lentoreitti päättyy, ankka on karannut.
      // duck.addEventListener("animationend", (event) => {});

      // Testaa konsolissa:
      // duck.classList.add('paused');    // keskeytä
      // duck.classList.remove('paused'); // jatka
    </script>
  </body>
</html>
